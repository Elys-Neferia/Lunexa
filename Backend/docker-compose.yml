services:
  mysql_db:
    image: mysql:8.0
    container_name: lunexa_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: lunexa123 # Bạn có thể đổi mật khẩu này
      MYSQL_DATABASE: lunexa_db # Tự động tạo sẵn database này
    ports:
      - "3306:3306" # Nối cổng 3306 của Docker ra cổng 3306 của máy tính bạn
    volumes:
      - mysql_data:/var/lib/mysql # Lưu trữ dữ liệu để không bị mất khi tắt Docker

volumes:
  mysql_data:
